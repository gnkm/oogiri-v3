[project]
name = "oogiri"
version = "0.1.0"
description = "お題を与えると、大喜利の回答を返す CLI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai>=1.15.21",
    "pydantic>=2.11",
    "typer>=0.16",
]

[project.scripts]
oogiri = "oogiri.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # CrewAI の chromadb が posthog<6 のため 3.9.7+ / 4.x は解けない
    "deepeval==3.9.6",
    "import-linter>=2.15",
    "pytest>=8.3",
    "radon>=6.0.1",
    "ruff>=0.16.7",
    "xenon>=0.9.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: live OpenRouter / DeepEval（secret があるときだけ。既定の収集から外す）",
]
addopts = ["-m", "not live", "-p", "no:deepeval"]

[tool.ruff]
target-version = "py313"
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.importlinter]
root_packages = ["oogiri"]
include_external_packages = true

# ARCHITECTURE.md: CLI がエントリ。設定と秘密は独立。llm はゲートウェイ。
[[tool.importlinter.contracts]]
name = "CLI は設定・秘密・LLM ゲートウェイの上に置く"
type = "layers"
layers = [
    "oogiri.cli",
    "oogiri.config | oogiri.secrets",
    "oogiri.llm",
]

# ARCHITECTURE.md: 評価は tests/。generate 経路に DeepEval を載せない。
[[tool.importlinter.contracts]]
name = "製品コードは DeepEval を import しない"
type = "forbidden"
source_modules = ["oogiri"]
forbidden_modules = ["deepeval"]
